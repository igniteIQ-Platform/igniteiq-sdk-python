[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "igniteiq-vault"
version = "0.3.0"
description = "Python SDK for the IgniteIQ Vault API — query home services data from LLM agents"
readme = "README.md"
license = { text = "MIT" }
# 3.10, not 3.9. The >=3.9 this replaced was never true: BOTH published releases
# (0.1.0 and 0.2.0) fail to import on 3.9 — errors.py evaluates `int | None` without
# `from __future__ import annotations`. Neither extra works there either; llama-index-core
# and langchain-core both declare >=3.10 themselves. Raising the floor makes the metadata
# describe the package that actually exists. 3.9 reached EOL in October 2025.
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24.0",
]
keywords = ["igniteiq", "vault", "home-services", "servicetitan", "ai", "llm", "langchain"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.1.0"]
llamaindex = ["llama-index-core>=0.10.0"]

[project.urls]
Homepage = "https://github.com/igniteIQ-Platform/igniteiq-sdk-python"

[tool.hatch.build.targets.wheel]
packages = ["igniteiq"]
